name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        # Fails the build when committed code isn't formatted, instead of
        # silently reformatting in CI (the reformatted files would be lost).
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate Android scaffolding
        run: flutter create . --platforms=android --project-name calcone

      - name: Set Android launcher label
        # flutter create derives the label from --project-name ("calcone");
        # the app must install as "Calcone".
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="calcone"/android:label="Calcone"/' "$MANIFEST"
          grep -o 'android:label="[^"]*"' "$MANIFEST" | head -1

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calcone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
