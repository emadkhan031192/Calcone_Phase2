name: calcone
description: "CalcOne — Simple outside. Genius inside. An all-in-one smart calculator."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Precision arithmetic — avoids classic floating point issues
  # (0.1 + 0.2 must display as 0.3, not 0.30000000000000004).
  decimal: ^2.3.3
  rational: ^2.2.3

  # Local persistence for the session tape and saved numbers.
  shared_preferences: ^2.2.3

  # State management — kept intentionally simple.
  flutter_riverpod: ^2.5.1

  # Sharing (result cards, calculation/session text via the native sheet).
  share_plus: ^9.0.0

  # Image sharing via the MediaStore (local plugin): share_plus file
  # sharing goes through androidx FileProvider, which R8 obfuscates in
  # release builds and crashes on real devices.
  media_share:
    path: plugins/media_share

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/formulas/
    - assets/fonts/
  fonts:
    # Bundled Outfit as static weights (the variable font's default
    # instance is Thin, which made every weight render thin) — the app
    # stays fully offline.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
