name: calcone
description: "CalcOne — Simple outside. Genius inside. An all-in-one smart calculator."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Precision arithmetic — avoids classic floating point issues
  # (0.1 + 0.2 must display as 0.3, not 0.30000000000000004).
  decimal: ^2.3.3
  rational: ^2.2.3

  # Local persistence for the session tape and saved numbers.
  shared_preferences: ^2.2.3

  # State management — kept intentionally simple.
  flutter_riverpod: ^2.5.1

  # Sharing (result cards, calculation/session text via the native sheet).
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/formulas/
